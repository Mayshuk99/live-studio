# Builds the Windows installer (Live-Studio-Setup-x.y.z.exe) and publishes it as a GitHub Release.
# Installed copies of Live Studio check these releases and update themselves.
#
# A new release is built automatically whenever package.json gets a new version on the main branch.
# You can also start one by hand: Actions tab → "Build Windows installer" → Run workflow.
name: Build Windows installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (leave empty to use the one in package.json)"
        required: false
  push:
    branches: [main]
    paths: ["package.json"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set version
        shell: pwsh
        run: |
          $v = "${{ github.event.inputs.version }}"
          if ($v) { npm version $v --no-git-tag-version --allow-same-version }
          $v = (Get-Content package.json | ConvertFrom-Json).version
          echo "Building Live Studio $v"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Download FFmpeg (encoder engine)
        shell: pwsh
        run: |
          # A release build of FFmpeg, not "master": master builds need NVIDIA driver 610+ (NVENC SDK 13.1),
          # which older cards such as the GTX 10xx series can never get (their last driver is the 580 series).
          # FFmpeg 8.0/8.1 builds use SDK 13.0 (driver 570+), 7.1 uses SDK 11.1 (driver 471+).
          New-Item -ItemType Directory -Force -Path resources/ffmpeg | Out-Null
          $ok = $false
          foreach ($v in @('8.1', '8.0', '7.1')) {
            try {
              if (Test-Path ffmpeg-tmp) { Remove-Item -Recurse -Force ffmpeg-tmp }
              Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n$v-latest-win64-gpl-$v.zip" -OutFile ffmpeg.zip
              Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-tmp
              $exe = Get-ChildItem ffmpeg-tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1
              Copy-Item $exe.FullName resources/ffmpeg/ffmpeg.exe -Force
              $ver = & resources/ffmpeg/ffmpeg.exe -hide_banner -version | Select-Object -First 1
              Write-Host $ver
              if ($ver -match "^ffmpeg version n$([regex]::Escape($v))") { $ok = $true; break }
              Write-Host "Unexpected version for $v"
            } catch { Write-Host "FFmpeg $v not available: $_" }
          }
          if (-not $ok) { throw 'No FFmpeg release build that works with older NVIDIA drivers was found' }

      - name: Test the encoder with the program's real settings
        run: node scripts/ffmpeg-selftest.js resources/ffmpeg/ffmpeg.exe

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false

      - name: Build the native engine (OBS-style picture engine)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path resources/engine | Out-Null
          go -C engine vet ./...
          go -C engine build -trimpath -ldflags "-s -w" -o ../resources/engine/ls-engine.exe .
          Get-Item resources/engine/ls-engine.exe

      - name: Test the native engine (fake camera, fade, graphic, sound, recording)
        run: node scripts/engine-selftest.js resources/engine/ls-engine.exe resources/ffmpeg/ffmpeg.exe

      - name: Build the plug-in host (VST3 inserts on the Master)
        shell: pwsh
        run: |
          # VST 3 SDK (MIT license) — only the parts the host needs; the sample plug-ins are built for the test below
          git clone --depth 1 --branch v3.8.1_build_84 https://github.com/steinbergmedia/vst3sdk vsthost/vst3sdk
          git -C vsthost/vst3sdk submodule update --init --depth 1 base pluginterfaces public.sdk cmake
          if ($LASTEXITCODE -ne 0) { throw 'VST 3 SDK download failed' }
          cmake -S vsthost -B vsthost/build -A x64 -DLSVST_TEST_PLUGINS=ON
          if ($LASTEXITCODE -ne 0) { throw 'cmake configure failed' }
          cmake --build vsthost/build --config Release --parallel --target ls-vst adelay mda-vst3
          if ($LASTEXITCODE -ne 0) { throw 'plug-in host build failed' }
          New-Item -ItemType Directory -Force -Path resources/vst | Out-Null
          $exe = Get-ChildItem vsthost/build -Recurse -Filter ls-vst.exe | Select-Object -First 1
          Copy-Item $exe.FullName resources/vst/ls-vst.exe -Force
          Copy-Item vsthost/vst3sdk/LICENSE.txt resources/vst/VST3_LICENSE.txt -Force
          Get-Item resources/vst/ls-vst.exe

      - name: Test the plug-in host (SDK sample plug-ins: echo, limiter, bypass, saved settings)
        run: node scripts/vst-selftest.js resources/vst/ls-vst.exe vsthost/build

      - name: Prepare the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          gh release view "v$v" 2>$null
          if ($LASTEXITCODE -eq 0) { gh release delete "v$v" --yes --cleanup-tag }
          gh release create "v$v" --draft --target "${{ github.sha }}" --title "Live Studio $v" --notes "Download **Live-Studio-Setup-$v.exe** below and run it. Installed copies update themselves."

      - name: Build installer and upload it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish always

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          gh release edit "v$v" --draft=false --latest
          gh release view "v$v"

      - name: Keep a copy of the installer on this run
        uses: actions/upload-artifact@v4
        with:
          name: Live-Studio-Setup
          path: dist/*.exe
