# Builds the Windows installer (Live-Studio-Setup-x.y.z.exe) and publishes it as a GitHub Release.
# Installed copies of Live Studio check these releases and update themselves.
#
# To release a new version:  Actions tab → "Build Windows installer" → Run workflow → type a version (e.g. 1.0.1)
name: Build Windows installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number for this release (e.g. 1.0.1) — must be higher than the last one"
        required: true
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set version
        shell: pwsh
        run: |
          $v = "${{ github.event.inputs.version }}"
          if (-not $v) { $v = "${{ github.ref_name }}".TrimStart('v') }
          npm version $v --no-git-tag-version --allow-same-version
          echo "Building Live Studio $v"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Download FFmpeg (encoder engine)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-tmp
          New-Item -ItemType Directory -Force -Path resources/ffmpeg | Out-Null
          $exe = Get-ChildItem ffmpeg-tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $exe.FullName resources/ffmpeg/ffmpeg.exe
          & resources/ffmpeg/ffmpeg.exe -hide_banner -version | Select-Object -First 1

      - name: Build installer and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish always -c.publish.provider=github -c.publish.releaseType=release -c.publish.owner=${{ github.repository_owner }} -c.publish.repo=${{ github.event.repository.name }}

      - name: Keep a copy of the installer on this run
        uses: actions/upload-artifact@v4
        with:
          name: Live-Studio-Setup
          path: dist/*.exe
